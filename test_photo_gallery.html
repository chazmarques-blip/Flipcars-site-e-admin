<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipCars - Photo Gallery Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
        }
        .lightbox.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-8">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h1 class="text-2xl font-bold mb-4">Lead: Test WithPhotos (FLIP-20251110-0008)</h1>
            
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-2">Vehicle Information</h2>
                <p class="text-gray-700">2023 Ford F-150</p>
            </div>

            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-2">Damage Photos (<span id="photoCount">0</span>)</h2>
                <div id="photoGallery" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <!-- Photos will be loaded here -->
                </div>
            </div>

            <div class="mt-4 p-4 bg-blue-50 rounded">
                <h3 class="font-semibold mb-2">🔍 Test Instructions:</h3>
                <ol class="list-decimal list-inside space-y-1 text-sm">
                    <li>Photos are loaded directly from the backend API</li>
                    <li>Click any photo to open lightbox</li>
                    <li>Click outside lightbox to close</li>
                    <li>Right-click and "Save image" to download</li>
                </ol>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="Photo">
    </div>

    <script>
        const LEAD_ID = '21d50c54-485b-45c9-8a12-11c933cc67ac';
        const API_URL = 'https://upbeat-dedication-production.up.railway.app/api';

        async function loadPhotos() {
            try {
                console.log('🔍 Fetching lead data...');
                
                // Login first
                const loginRes = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@flipcars.com',
                        password: 'Admin123!'
                    })
                });
                
                const loginData = await loginRes.json();
                const token = loginData.tokens.accessToken;
                console.log('✅ Login successful');

                // Fetch lead
                const leadRes = await fetch(`${API_URL}/leads/${LEAD_ID}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const lead = await leadRes.json();
                console.log('✅ Lead data:', lead);
                
                const photos = lead.damagePhotos || [];
                console.log(`📸 Found ${photos.length} photos`);

                // Update count
                document.getElementById('photoCount').textContent = photos.length;

                // Render gallery
                const gallery = document.getElementById('photoGallery');
                
                if (photos.length === 0) {
                    gallery.innerHTML = `
                        <div class="col-span-full text-center py-8 text-gray-500">
                            <svg class="w-16 h-16 mx-auto mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <p>No photos uploaded yet</p>
                        </div>
                    `;
                } else {
                    gallery.innerHTML = photos.map((url, index) => `
                        <div class="relative group cursor-pointer" onclick="openLightbox('${url}')">
                            <img 
                                src="${url}" 
                                alt="Damage Photo ${index + 1}"
                                class="w-full h-48 object-cover rounded-lg shadow hover:shadow-xl transition"
                            >
                            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition rounded-lg flex items-center justify-center">
                                <span class="text-white opacity-0 group-hover:opacity-100 transition">
                                    🔍 View Full Size
                                </span>
                            </div>
                        </div>
                    `).join('');
                }

            } catch (error) {
                console.error('❌ Error:', error);
                document.getElementById('photoGallery').innerHTML = `
                    <div class="col-span-full text-center py-8 text-red-500">
                        <p>Error loading photos: ${error.message}</p>
                    </div>
                `;
            }
        }

        function openLightbox(url) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        // Load photos on page load
        loadPhotos();
    </script>
</body>
</html>
