<!DOCTYPE html>
<html>
<head>
    <title>VIN Button Test</title>
    <style>
        .relative { position: relative; }
        .absolute { position: absolute; }
        button {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            padding: 4px 12px;
            background: #D4AF37;
            color: black;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
        }
        input {
            width: 100%;
            padding: 6px 100px 6px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>VIN Scanner Button Test</h1>
    <div class="relative" style="max-width: 400px;">
        <input type="text" placeholder="ENTER 17-CHARACTER VIN" maxlength="17">
        <button onclick="alert('Scan button clicked!')">
            📸 Scan
        </button>
    </div>
    <p>If you see the "📸 Scan" button above, the styling works!</p>
</body>
</html>
