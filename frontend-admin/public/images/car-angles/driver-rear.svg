<svg width="200" height="120" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Driver Rear View (3/4 rear-left) -->
  <g transform="translate(20, 20)">
    <!-- Car body -->
    <path d="M 30 30 L 40 20 L 130 20 L 140 30 L 140 60 L 130 70 L 40 70 L 30 60 Z" 
          fill="#1a1a1a" 
          stroke="#000000" 
          stroke-width="2"/>
    
    <!-- Rear window -->
    <path d="M 45 25 L 55 22 L 115 22 L 125 25 L 115 30 L 55 30 Z" 
          fill="#3a3a3a" 
          stroke="#000000" 
          stroke-width="1.5"/>
    
    <!-- Trunk -->
    <path d="M 40 40 L 50 35 L 120 35 L 130 40 L 120 45 L 50 45 Z" 
          fill="#2a2a2a" 
          stroke="#000000" 
          stroke-width="1.5"/>
    
    <!-- Taillight left -->
    <rect x="38" y="48" width="12" height="8" rx="2" 
          fill="#4a0000" 
          stroke="#000000" 
          stroke-width="1"/>
    
    <!-- Taillight right -->
    <rect x="120" y="48" width="12" height="8" rx="2" 
          fill="#4a0000" 
          stroke="#000000" 
          stroke-width="1"/>
    
    <!-- Wheel left -->
    <circle cx="50" cy="70" r="10" 
            fill="#000000" 
            stroke="#1a1a1a" 
            stroke-width="2"/>
    <circle cx="50" cy="70" r="5" 
            fill="#2a2a2a"/>
    
    <!-- Wheel right -->
    <circle cx="120" cy="70" r="10" 
            fill="#000000" 
            stroke="#1a1a1a" 
            stroke-width="2"/>
    <circle cx="120" cy="70" r="5" 
            fill="#2a2a2a"/>
    
    <!-- Side mirror -->
    <ellipse cx="35" cy="35" rx="5" ry="3" 
             fill="#1a1a1a" 
             stroke="#000000" 
             stroke-width="1"/>
    
    <!-- Bumper -->
    <rect x="40" y="58" width="90" height="4" rx="2" 
          fill="#2a2a2a" 
          stroke="#000000" 
          stroke-width="1"/>
  </g>
</svg>
