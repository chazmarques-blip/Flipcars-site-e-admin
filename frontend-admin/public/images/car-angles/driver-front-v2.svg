<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Driver Front 3/4 View - Line Art Style -->
  
  <!-- Main body outline -->
  <path d="M 50 140 L 60 110 L 75 90 L 95 80 L 140 75 L 180 80 L 210 90 L 230 110 L 240 140 L 240 145 L 235 148 L 60 148 L 50 145 Z" 
        stroke="#D4AF37" 
        stroke-width="1.5" 
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Roof line -->
  <path d="M 75 90 L 85 75 L 110 70 L 145 70 L 175 75 L 195 85 L 210 90" 
        stroke="#D4AF37" 
        stroke-width="1.5" 
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Front windshield -->
  <path d="M 85 75 L 95 80 L 95 88" 
        stroke="#D4AF37" 
        stroke-width="1" 
        fill="none"
        stroke-linecap="round"/>
  
  <!-- Side windshield left -->
  <path d="M 110 70 L 115 72 L 118 85" 
        stroke="#D4AF37" 
        stroke-width="1" 
        fill="none"
        stroke-linecap="round"/>
  
  <!-- Side windshield right -->
  <path d="M 165 72 L 160 70 L 155 85" 
        stroke="#D4AF37" 
        stroke-width="1" 
        fill="none"
        stroke-linecap="round"/>
  
  <!-- Rear windshield -->
  <path d="M 195 85 L 188 80 L 188 88" 
        stroke="#D4AF37" 
        stroke-width="1" 
        fill="none"
        stroke-linecap="round"/>
  
  <!-- Hood line -->
  <path d="M 60 110 L 75 100 L 120 95 L 165 100 L 195 110" 
        stroke="#D4AF37" 
        stroke-width="1.2" 
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Front door line -->
  <path d="M 95 88 L 95 140" 
        stroke="#D4AF37" 
        stroke-width="1" 
        fill="none"
        stroke-linecap="round"/>
  
  <!-- Rear door line -->
  <path d="M 155 88 L 155 140" 
        stroke="#D4AF37" 
        stroke-width="1" 
        fill="none"
        stroke-linecap="round"/>
  
  <!-- Side mirror left -->
  <path d="M 75 100 L 65 102 L 63 105 L 65 108 L 75 110" 
        stroke="#D4AF37" 
        stroke-width="1" 
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Door handle left -->
  <line x1="85" y1="115" x2="90" y2="115" 
        stroke="#D4AF37" 
        stroke-width="1" 
        stroke-linecap="round"/>
  
  <!-- Door handle right -->
  <line x1="165" y1="115" x2="170" y2="115" 
        stroke="#D4AF37" 
        stroke-width="1" 
        stroke-linecap="round"/>
  
  <!-- Headlight left -->
  <ellipse cx="68" cy="120" rx="8" ry="6" 
           stroke="#D4AF37" 
           stroke-width="1.2" 
           fill="none"/>
  
  <!-- Headlight right -->
  <ellipse cx="215" cy="120" rx="8" ry="6" 
           stroke="#D4AF37" 
           stroke-width="1.2" 
           fill="none"/>
  
  <!-- Front grille -->
  <path d="M 80 120 L 85 118 L 110 115 L 140 115 L 165 118 L 170 120" 
        stroke="#D4AF37" 
        stroke-width="1" 
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Wheel arch left -->
  <path d="M 60 148 A 25 25 0 0 1 110 148" 
        stroke="#D4AF37" 
        stroke-width="1.5" 
        fill="none"/>
  
  <!-- Wheel arch right -->
  <path d="M 175 148 A 25 25 0 0 1 225 148" 
        stroke="#D4AF37" 
        stroke-width="1.5" 
        fill="none"/>
  
  <!-- Wheel left outer -->
  <circle cx="85" cy="148" r="20" 
          stroke="#D4AF37" 
          stroke-width="2" 
          fill="none"/>
  
  <!-- Wheel left inner rim -->
  <circle cx="85" cy="148" r="12" 
          stroke="#D4AF37" 
          stroke-width="1" 
          fill="none"/>
  
  <!-- Wheel left spokes -->
  <line x1="85" y1="136" x2="85" y2="160" 
        stroke="#D4AF37" 
        stroke-width="0.8"/>
  <line x1="73" y1="148" x2="97" y2="148" 
        stroke="#D4AF37" 
        stroke-width="0.8"/>
  
  <!-- Wheel right outer -->
  <circle cx="200" cy="148" r="20" 
          stroke="#D4AF37" 
          stroke-width="2" 
          fill="none"/>
  
  <!-- Wheel right inner rim -->
  <circle cx="200" cy="148" r="12" 
          stroke="#D4AF37" 
          stroke-width="1" 
          fill="none"/>
  
  <!-- Wheel right spokes -->
  <line x1="200" y1="136" x2="200" y2="160" 
        stroke="#D4AF37" 
        stroke-width="0.8"/>
  <line x1="188" y1="148" x2="212" y2="148" 
        stroke="#D4AF37" 
        stroke-width="0.8"/>
  
  <!-- Ground line -->
  <line x1="30" y1="168" x2="270" y2="168" 
        stroke="#D4AF37" 
        stroke-width="0.5" 
        opacity="0.3"/>
</svg>
