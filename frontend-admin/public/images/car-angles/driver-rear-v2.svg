<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Driver Rear 3/4 View - Line Art Style -->
  
  <!-- Main body outline -->
  <path d="M 50 140 L 60 115 L 75 95 L 95 85 L 140 80 L 180 85 L 210 95 L 230 115 L 240 140 L 240 145 L 235 148 L 60 148 L 50 145 Z" 
        stroke="#D4AF37" 
        stroke-width="1.5" 
