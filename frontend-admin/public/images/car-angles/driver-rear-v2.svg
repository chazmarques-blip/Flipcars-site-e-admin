        stroke-width="1.2" 
        fill="none"/>
  <line x1="66" y1="127" x2="66" y2="131" 
        stroke="#D4AF37" 
        stroke-width="0.5"/>
  <line x1="70" y1="127" x2="70" y2="131" 
