        stroke-width="0.8"/>
  <line x1="73" y1="148" x2="97" y2="148" 
        stroke="#D4AF37" 
        stroke-width="0.8"/>
  <line x1="79" y1="142" x2="91" y2="154" 
        stroke="#D4AF37" 
        stroke-width="0.8"/>
  <line x1="79" y1="154" x2="91" y2="142" 
        stroke="#D4AF37" 
        stroke-width="0.8"/>
  
  <!-- Wheel right outer -->
  <circle cx="200" cy="148" r="20" 
          stroke="#D4AF37" 
          stroke-width="2" 
          fill="none"/>
  
  <!-- Wheel right inner rim -->
  <circle cx="200" cy="148" r="12" 
          stroke="#D4AF37" 
          stroke-width="1" 
          fill="none"/>
  
  <!-- Wheel right spokes -->
  <line x1="200" y1="136" x2="200" y2="160" 
        stroke="#D4AF37" 
        stroke-width="0.8"/>
  <line x1="188" y1="148" x2="212" y2="148" 
        stroke="#D4AF37" 
        stroke-width="0.8"/>
  <line x1="194" y1="142" x2="206" y2="154" 
        stroke="#D4AF37" 
        stroke-width="0.8"/>
  <line x1="194" y1="154" x2="206" y2="142" 
        stroke="#D4AF37" 
        stroke-width="0.8"/>
  
  <!-- Ground line -->
  <line x1="30" y1="168" x2="270" y2="168" 
