  <!-- Rear windshield -->
  <path d="M 85 80 L 95 85 L 98 93" 
        stroke="#D4AF37" 
        stroke-width="1" 
        fill="none"
        stroke-linecap="round"/>
  
  <!-- Side window left -->
  <path d="M 110 75 L 115 77 L 120 90" 
