        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Roof line -->
  <path d="M 75 95 L 85 80 L 110 75 L 145 75 L 175 80 L 195 90 L 210 95" 
        stroke="#D4AF37" 
