        stroke-width="1.2" 
        fill="none"/>
  <line x1="222" y1="127" x2="222" y2="131" 
        stroke="#D4AF37" 
        stroke-width="0.5"/>
  <line x1="226" y1="127" x2="226" y2="131" 
