<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Upload - FlipCars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .upload-section {
            margin-bottom: 30px;
        }
        .upload-box {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-box:hover {
            border-color: #D4AF37;
            background: #fafafa;
        }
        .upload-box.uploading {
            border-color: #D4AF37;
            background: #fffbf0;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        input[type="file"] {
            display: none;
        }
        button {
            background: #D4AF37;
            color: #1a1a1a;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) {
            background: #c9a332;
            transform: translateY(-1px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .preview {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-item .filename {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px;
            font-size: 12px;
            text-align: center;
            word-break: break-all;
        }
        .log {
            background: #1a1a1a;
            color: #0f0;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log-entry {
            margin-bottom: 5px;
        }
        .log-success { color: #0f0; }
        .log-error { color: #f00; }
        .log-info { color: #0af; }
        .log-warning { color: #fa0; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: #f8f8f8;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #D4AF37;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 FlipCars - Teste de Upload de Fotos</h1>
        <p class="subtitle">Teste o sistema de upload para o Supabase Storage</p>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="uploadCount">0</div>
                <div class="stat-label">Uploads Feitos</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="successCount">0</div>
                <div class="stat-label">Sucessos</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="errorCount">0</div>
                <div class="stat-label">Erros</div>
            </div>
        </div>

        <div class="upload-section">
            <div class="upload-box" id="uploadBox" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📸</div>
                <p><strong>Clique para selecionar fotos</strong></p>
                <p style="color: #666; font-size: 14px; margin-top: 5px;">Ou arraste arquivos aqui</p>
            </div>
            <input type="file" id="fileInput" multiple accept="image/*">
        </div>

        <div class="preview" id="preview"></div>

        <div class="log" id="log">
            <div class="log-entry log-info">📋 Console de Log - Aguardando uploads...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://upbeat-dedication-production.up.railway.app/api';
        let uploadCount = 0;
        let successCount = 0;
        let errorCount = 0;

        function updateStats() {
            document.getElementById('uploadCount').textContent = uploadCount;
            document.getElementById('successCount').textContent = successCount;
            document.getElementById('errorCount').textContent = errorCount;
        }

        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function compressImage(file) {
            addLog(`🔄 Comprimindo imagem: ${file.name}`, 'info');
            
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1920;
                        const MAX_HEIGHT = 1920;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            const originalSizeMB = (file.size / 1024 / 1024).toFixed(2);
                            const compressedSizeMB = (blob.size / 1024 / 1024).toFixed(2);
                            const reduction = ((1 - blob.size / file.size) * 100).toFixed(1);
                            
                            addLog(`✅ Compressão: ${originalSizeMB}MB → ${compressedSizeMB}MB (${reduction}% redução)`, 'success');
                            
                            const compressedFile = new File([blob], file.name, {
                                type: 'image/jpeg',
                                lastModified: Date.now(),
                            });
                            resolve(compressedFile);
                        }, 'image/jpeg', 0.8);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function uploadPhoto(file) {
            uploadCount++;
            updateStats();

            const uploadBox = document.getElementById('uploadBox');
            uploadBox.classList.add('uploading');

            try {
                addLog(`📤 Iniciando upload: ${file.name}`, 'info');

                // Comprimir imagem
                const compressedFile = await compressImage(file);

                // Criar FormData
                const formData = new FormData();
                formData.append('file', compressedFile);

                // Upload para servidor
                addLog(`⬆️  Enviando para servidor...`, 'info');
                const response = await fetch(`${API_URL}/public/upload/photo`, {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    successCount++;
                    updateStats();
                    
                    addLog(`✅ Upload bem-sucedido!`, 'success');
                    addLog(`🔗 URL: ${data.data.url}`, 'success');

                    // Adicionar preview
                    addPreview(data.data.url, file.name);
                } else {
                    throw new Error(data.message || 'Upload falhou');
                }

            } catch (error) {
                errorCount++;
                updateStats();
                addLog(`❌ Erro no upload: ${error.message}`, 'error');
                console.error('Upload error:', error);
            } finally {
                uploadBox.classList.remove('uploading');
            }
        }

        function addPreview(url, filename) {
            const previewDiv = document.getElementById('preview');
            const item = document.createElement('div');
            item.className = 'preview-item';
            item.innerHTML = `
                <img src="${url}" alt="${filename}" loading="lazy">
                <div class="filename">${filename}</div>
            `;
            previewDiv.appendChild(item);
        }

        // Event listeners
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            addLog(`📁 ${files.length} arquivo(s) selecionado(s)`, 'info');
            
            for (const file of files) {
                await uploadPhoto(file);
            }
            
            // Reset input
            e.target.value = '';
        });

        // Drag and drop
        const uploadBox = document.getElementById('uploadBox');
        
        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.style.borderColor = '#D4AF37';
            uploadBox.style.background = '#fffbf0';
        });

        uploadBox.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadBox.style.borderColor = '#ddd';
            uploadBox.style.background = 'transparent';
        });

        uploadBox.addEventListener('drop', async (e) => {
            e.preventDefault();
            uploadBox.style.borderColor = '#ddd';
            uploadBox.style.background = 'transparent';

            const files = Array.from(e.dataTransfer.files).filter(file => 
                file.type.startsWith('image/')
            );
            
            if (files.length > 0) {
                addLog(`📁 ${files.length} arquivo(s) arrastado(s)`, 'info');
                
                for (const file of files) {
                    await uploadPhoto(file);
                }
            }
        });

        // Teste automático ao carregar (opcional)
        addLog('🚀 Sistema pronto para upload!', 'success');
        addLog(`📍 API URL: ${API_URL}`, 'info');
    </script>
</body>
</html>
